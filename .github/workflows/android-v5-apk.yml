name: Build Gas Alert System v5.0 APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-v5-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android v5.0 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify all displayed and build versions equal 5.0
        run: |
          grep -q "versionName '5.0'" android/app/build.gradle
          grep -q 'Version 5.0' android/app/src/main/java/nl/hbelectronics/hpgastest/MainActivity.java
          grep -q 'HP Gas Alert v5.0' android/app/src/main/AndroidManifest.xml
          if grep -R -n -E '(Version 1\\.[0-9]|v1\\.[0-9]|versionName.*1\\.)' android/app/src/main android/app/build.gradle; then
            echo "ERROR: old 1.x version label found"; exit 1
          fi
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Rename APK for distribution
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Gas-Alert-System-v5.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Gas-Alert-System-v5.0-APK
          path: Gas-Alert-System-v5.0-debug.apk
          retention-days: 30
          if-no-files-found: error
